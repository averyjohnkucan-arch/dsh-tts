name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --ignore-scripts --config.strictDepBuilds=false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 soundfile==0.13.1
      - run: echo "TTS_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --out /tmp/plugin-ci.tgz
